<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Hotel</title>
</head>
<body>

    <h1>Trivago Hotel</h1>
    <h2>Cadastro de Hotel</h2>

    <form action="salvar_hotel.php" method="post">

        <label for="nome_hotel">Nome do Hotel:</label>
        <input type="text" id="nome_hotel" name="nome_hotel">

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade">

        <label for="classificacao">Classificação em Estrelas (1 a 5):</label>
        <input type="number" id="classificacao" name="classificacao" min="1" max="5">

        <button type="submit">Enviar Cadastro</button>
    </form>

    <a href="salvar_hotel.php">Voltar à página principal/painel</a>

</body>
</html>
