<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | trivago</title>

    <link rel="stylesheet" href="./css/estilo_projeto.css">

</head>

<body>
    <header class="cabecalho">

        <div class="logo">
            trivago
        </div>
    </header>


    <main class="pagina-login">

        <div class="login-container">

            <div class="login-card">

                <div class="titulo-login">

                    <h1>Bem-vindo!</h1>

                    <p>
                        Entre na sua conta
                    </p>

                </div>


                <p class="subtitulo">

                    Acesse sua conta para gerenciar suas reservas
                    e encontrar os melhores hotéis.

                </p>


                <form action="autenticar.php" method="POST">

                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>


                    <button type="submit" class="btn-entrar">
                        Entrar na minha conta
                    </button>

                </form>


                <div class="separador">

                    <span>ou</span>

                </div>


                <div class="cadastro">

                    <p>
                        Ainda não possui uma conta?
                    </p>

                    <a href="cadastro_cliente.html">
                        Criar uma conta
                    </a>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
